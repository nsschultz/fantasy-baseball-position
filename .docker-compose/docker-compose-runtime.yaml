version: "3.8"
services:
  api:
    build: ../
    restart: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - POSITION_DATABASE=${POSITION_DATABASE:-position-db}
      - POSITION_DATABASE_HOST=${POSITION_DATABASE_HOST:-database}
      - POSITION_DATABASE_PASSWORD=${POSITION_DATABASE_PASSWORD:?Error: POSITION_DATABASE_PASSWORD not set}
      - POSITION_DATABASE_USER=${POSITION_DATABASE_USER:?Error: POSITION_DATABASE_USER not set}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - app-network
  database:
    build: database/
    restart: always
    user: postgres
    environment:
      - POSTGRES_DB=${POSITION_DATABASE:-position-db}
      - POSTGRES_USER=${POSITION_DATABASE_USER:?Error: POSITION_DATABASE_USER not set}
      - POSTGRES_PASSWORD=${POSITION_DATABASE_PASSWORD:?Error: POSITION_DATABASE_PASSWORD not set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSITION_DATABASE_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    volumes:
      - data_volume:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - app-network
  pgadmin:
    build: pgadmin/
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:?Error: PGADMIN_PASSWORD not set}
    ports:
      - "9000:80"
    volumes:
      - pgadmin_volume:/var/lib/pgadmin
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - app-network
volumes:
  data_volume:
  pgadmin_volume:
networks:
  app-network:
    driver: bridge
